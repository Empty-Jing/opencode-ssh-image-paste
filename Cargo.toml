[package]
name = "opencode-ssh-image-paste"
version = "0.1.9"
edition = "2024"
rust-version = "1.89"
description = "Paste Windows clipboard images into a remote OpenCode TUI over SSH"
license = "MIT"
readme = "README.md"
keywords = ["clipboard", "opencode", "ssh", "terminal", "windows"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"

[target.'cfg(windows)'.dependencies]
arboard = { version = "3.6", features = ["image-data"] }
png = "0.18"
ureq = { version = "3.1", default-features = false, features = ["rustls"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_DataExchange",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
ureq = { version = "3.1", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "tokio",
] }
axum-server = { version = "0.8", default-features = false, features = [
  "tls-rustls-no-provider",
] }
getrandom = "0.3"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
tokio = { version = "1.47", features = ["rt-multi-thread", "sync", "time"] }
