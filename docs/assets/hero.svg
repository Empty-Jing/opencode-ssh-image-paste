<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">OpenCode SSH Image Paste</title>
  <desc id="desc">Use Ctrl+V to paste a Windows clipboard image into OpenCode running on remote Linux over SSH.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111C"/>
      <stop offset="1" stop-color="#0A1724"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#163047" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#38BDF8"/>
    </marker>
  </defs>

  <rect width="1200" height="380" rx="28" fill="url(#background)"/>
  <rect width="1200" height="380" rx="28" fill="url(#grid)" opacity=".52"/>
  <circle cx="1040" cy="55" r="170" fill="#0EA5E9" opacity=".06"/>
  <path d="M614 44V336" stroke="#1E3A50"/>

  <g transform="translate(56 47)">
    <text x="0" y="18" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="1.8">OPENCODE SSH IMAGE PASTE</text>
    <text x="0" y="105" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="69" font-weight="760" letter-spacing="-3">Ctrl+V,</text>
    <text x="0" y="174" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="69" font-weight="760" letter-spacing="-3">over SSH.</text>
    <text x="0" y="220" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22">Windows screenshots → remote OpenCode.</text>
    <text x="0" y="251" fill="#7890A4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Same shortcut. Persistent connection. No Rust required.</text>

    <g transform="translate(0 278)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
      <g><rect width="133" height="34" rx="17" fill="#0C1D2C" stroke="#28506C"/><circle cx="19" cy="17" r="4" fill="#4ADE80"/><text x="32" y="22" fill="#D7E3EC">WINDOWS 10/11</text></g>
      <g transform="translate(145)"><rect width="116" height="34" rx="17" fill="#0C1D2C" stroke="#28506C"/><text x="17" y="22" fill="#D7E3EC">OPENSSH</text></g>
      <g transform="translate(273)"><rect width="171" height="34" rx="17" fill="#0C1D2C" stroke="#28506C"/><text x="17" y="22" fill="#D7E3EC">LINUX x64 / ARM64</text></g>
    </g>
  </g>

  <g transform="translate(658 47)">
    <text x="0" y="17" fill="#7890A4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.4">LOCAL WINDOWS</text>
    <rect x="0" y="34" width="196" height="145" rx="18" fill="#0A1825" stroke="#28506C"/>
    <rect x="22" y="57" width="60" height="70" rx="9" fill="#10283A" stroke="#38BDF8" stroke-width="2"/>
    <path d="M35 105l13-15 10 11 7-8 10 12" fill="none" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="64" cy="76" r="5" fill="#FBBF24"/>
    <text x="98" y="81" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">screenshot</text>
    <text x="98" y="109" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">Ctrl+V</text>
    <text x="22" y="153" fill="#7890A4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Windows Terminal</text>

    <path d="M216 99H292" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" filter="url(#glow)"/>
    <text x="220" y="79" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">OPENSSH</text>
    <text x="218" y="124" fill="#567086" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">persistent</text>

    <text x="311" y="17" fill="#7890A4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.4">REMOTE LINUX</text>
    <rect x="307" y="34" width="179" height="145" rx="18" fill="#0A1825" stroke="#28506C"/>
    <rect x="326" y="55" width="141" height="91" rx="9" fill="#07111C" stroke="#18384F"/>
    <circle cx="339" cy="68" r="3" fill="#F87171"/><circle cx="350" cy="68" r="3" fill="#FBBF24"/><circle cx="361" cy="68" r="3" fill="#4ADE80"/>
    <text x="338" y="96" fill="#4ADE80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">›</text>
    <text x="354" y="96" fill="#D7E3EC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">[Image 1]</text>
    <text x="326" y="162" fill="#7890A4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">OpenCode TUI</text>

    <g transform="translate(0 213)">
      <rect width="486" height="84" rx="16" fill="#07111C" stroke="#1E3A50"/>
      <circle cx="21" cy="20" r="4" fill="#38BDF8"/><circle cx="35" cy="20" r="4" fill="#27475E"/><circle cx="49" cy="20" r="4" fill="#27475E"/>
      <text x="20" y="52" fill="#4ADE80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">[OK]</text>
      <text x="60" y="52" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">SSH · receiver · background client</text>
      <text x="424" y="52" fill="#4ADE80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">ready</text>
    </g>
  </g>
</svg>
